
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iControl</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>iControl</h1>
    <p>Connecte tes appareils en toute simplicité.</p>

    <div class="connexion">
        <h2>Choisis ton appareil</h2>

        <button id="iphoneBtn">Je suis sur iPhone</button>
        <button id="ipadBtn">Je suis sur iPad</button>

        <div id="iphoneArea" hidden>
            <h2>Ton code de connexion</h2>
            <h1 id="generatedCode">------</h1>
            <p>Entre ce code sur ton iPad.</p>
        </div>

        <div id="ipadArea" hidden>
            <h2>Rejoindre un iPhone</h2>
            <input type="text" id="code" placeholder="Entre le code de connexion">
            <button id="joinBtn">Rejoindre</button>
        </div>

        <p id="message"></p>
    </div>

    <div id="controlArea" hidden>
        <h2>Panneau de contrôle</h2>

        <p id="connectionStatus">
            <span id="statusDot">●</span>
            <span id="statusText">Déconnecté</span>
        </p>

        <button id="leaveBtn">Quitter la session</button>

        <h3>Messages</h3>

        <div id="messageHistory">
            <p>Aucun message pour le moment.</p>
        </div>

        <input
            id="messageInput"
            type="text"
            placeholder="Écris un message"
            maxlength="300"
        >

        <button id="sendBtn">Envoyer</button>
    </div>

<div id="screenShareArea">
    <h2>Partage d'écran</h2>
    <button id="startScreenShare">Partager mon écran</button>
    <button id="stopScreenShare" disabled>Arrêter le partage</button>

    <p id="screenShareStatus">Aucun partage en cours.</p>

    <video
        id="screenPreview"
        autoplay
        playsinline
        muted
        style="width:100%; max-width:500px;"
    ></video>
</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>

<script>
const startButton = document.getElementById("startScreenShare");
const stopButton = document.getElementById("stopScreenShare");
const status = document.getElementById("screenShareStatus");
const preview = document.getElementById("screenPreview");

let screenStream = null;

startButton.addEventListener("click", async () => {
    if (!navigator.mediaDevices?.getDisplayMedia) {
        status.textContent =
            "Le partage d'écran n'est pas pris en charge par ce navigateur.";
        return;
    }

    try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: false
        });

        preview.srcObject = screenStream;
        stopButton.disabled = false;
        status.textContent = "Partage d'écran actif.";

        screenStream.getVideoTracks()[0].addEventListener("ended", stopSharing);
    } catch (error) {
        status.textContent = "Partage impossible : " + error.message;
    }
});

function stopSharing() {
    if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
    }

    preview.srcObject = null;
    stopButton.disabled = true;
    status.textContent = "Partage arrêté.";
}

stopButton.addEventListener("click", stopSharing);
</script>

</body>
</html>
